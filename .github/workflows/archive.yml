name: Check and archive .ye sites

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: propaganda-machine-archive
  cancel-in-progress: false

env:
  PAGE_LIMIT: "20"
  SITE_SIZE_LIMIT_MIB: "10"
  RESOURCE_SIZE_LIMIT_MIB: "1"
  SITE_TIMEOUT_MINUTES: "2"
  SITE_HARD_LIMIT_MIB: "12"
  RETAIN_RELEASES: "4"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out the inventory and scripts
        uses: actions/checkout@v4

      - name: Verify runner tools
        run: |
          python3 --version
          python3 -m py_compile scripts/*.py
          wget --version | head -n 1
          gh --version | head -n 1

      - name: Refresh and probe the complete observed .gov.ye inventory
        run: >-
          python3 scripts/discover_govye.py sites.txt govye-domains.txt
          out/targets.txt out/govye-domains.txt out/govye-discovery.csv

      - name: Check every configured site
        run: python3 scripts/check_sites.py out/targets.txt out/site-status.csv

      - name: Create bounded WARC archives
        run: SITES_FILE=out/targets.txt bash scripts/archive.sh

      - name: Add results to the workflow summary
        if: always()
        run: |
          echo "## .ye site check and archive" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [[ -f out/site-status.csv ]]; then
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat out/site-status.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f out/manifest.csv ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat out/manifest.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish WARC files as a repository release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="archive-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          title=".ye archive $(date -u +%Y-%m-%d)"
          notes="Automated public-web capture of every reachable observed .gov.ye host plus pinned .ye media. Each target is capped at its homepage plus 20 discovered pages, a 10 MiB download quota, a 1 MiB per-resource limit, a 12 MiB WARC hard limit, and 2 minutes. See the discovery report, manifest, and status report for completeness and failures."
          gh release create "$tag" out/* --title "$title" --notes "$notes"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Retain only the newest archive releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t stale_tags < <(
            gh release list --limit 100 --json tagName,publishedAt \
              --jq 'map(select(.tagName | startswith("archive-"))) | sort_by(.publishedAt) | reverse | .[].tagName' \
              | awk "NR > ${RETAIN_RELEASES}"
          )
          for stale_tag in "${stale_tags[@]}"; do
            gh release delete "$stale_tag" --cleanup-tag --yes
          done

      - name: Record the latest successful run on the default branch
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          site_count="$(tail -n +2 out/manifest.csv | wc -l | tr -d ' ')"
          archive_count="$(find out -maxdepth 1 -name '*.warc.gz' -type f | wc -l | tr -d ' ')"
          observed_count="$(grep -Ev '^[[:space:]]*(#|$)' out/govye-domains.txt | wc -l | tr -d ' ')"
          reachable_count="$(grep -Ec '^https?://([^/]+\.)?gov\.ye/?$' out/targets.txt || true)"
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo '# Latest archive run'
            echo
            echo "- Release: [${RELEASE_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
            echo "- Completed: ${captured_at}"
            echo "- Configured targets processed: ${site_count}"
            echo "- WARC files produced: ${archive_count}"
            echo "- Observed .gov.ye domains: ${observed_count}"
            echo "- Reachable .gov.ye web hosts: ${reachable_count}"
            echo
            echo 'Detailed status, manifests, checksums, CDX indexes, and WARC files are attached to the release.'
          } > LATEST.md
          cp out/govye-domains.txt govye-domains.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LATEST.md govye-domains.txt
          git commit -m "chore: record archive ${RELEASE_TAG}"
          git push origin HEAD:main
