name: Check and archive .ye sites

on:
  schedule:
    - cron: "17 0 * * 4,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: propaganda-machine-archive
  cancel-in-progress: false

env:
  PAGE_LIMIT: "20"
  SITE_SIZE_LIMIT_MIB: "10"
  SITE_TIMEOUT_MINUTES: "2"
  SITE_HARD_LIMIT_MIB: "12"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out the inventory and scripts
        uses: actions/checkout@v4

      - name: Verify runner tools
        run: |
          python3 --version
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -v
          wget --version | head -n 1
          gh --version | head -n 1

      - name: Prepare the permanent cross-run deduplication index
        run: |
          mkdir -p work
          python3 scripts/build_dedupe_cdx.py history work/dedupe.cdx

      - name: Refresh and probe the complete observed .gov.ye inventory
        run: >-
          python3 scripts/discover_govye.py sites.txt govye-domains.txt
          out/targets.txt out/govye-domains.txt out/govye-discovery.csv

      - name: Check every configured site
        run: python3 scripts/check_sites.py out/targets.txt out/site-status.csv

      - name: Create bounded WARC archives
        run: >-
          SITES_FILE=out/targets.txt
          DEDUP_CDX=work/dedupe.cdx
          bash scripts/archive.sh

      - name: Add results to the workflow summary
        if: always()
        run: |
          echo "## .ye site check and archive" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [[ -f out/site-status.csv ]]; then
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat out/site-status.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f out/manifest.csv ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat out/manifest.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish WARC files as a repository release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="archive-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          title=".ye archive $(date -u +%Y-%m-%d)"
          notes="Automated public-web capture of every reachable observed .gov.ye host plus pinned .ye media and related sites. Each target is capped at its homepage plus 20 discovered pages, a 10 MiB download quota, a 12 MiB WARC hard limit, and 2 minutes. Oversized captures fall back to the homepage without assets. See the discovery report, manifest, and status report for completeness and failures."
          gh release create "$tag" out/* --title "$title" --notes "$notes"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Permanently record the successful run on the default branch
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          site_count="$(tail -n +2 out/manifest.csv | wc -l | tr -d ' ')"
          archive_count="$(find out -maxdepth 1 -name '*.warc.gz' -type f | wc -l | tr -d ' ')"
          observed_count="$(grep -Ev '^[[:space:]]*(#|$)' out/govye-domains.txt | wc -l | tr -d ' ')"
          reachable_count="$(grep -Ec '^https?://([^/]+\.)?gov\.ye/?$' out/targets.txt || true)"
          response_count="$(awk -F, 'NR > 1 { total += $9 } END { print total + 0 }' out/manifest.csv)"
          revisit_count="$(awk -F, 'NR > 1 { total += $10 } END { print total + 0 }' out/manifest.csv)"
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          history_dir="history/${RELEASE_TAG}"
          mkdir -p "${history_dir}/cdx"
          cp out/*.cdx "${history_dir}/cdx/"
          cp out/manifest.csv out/site-status.csv out/targets.txt \
            out/govye-discovery.csv out/govye-domains.txt out/SHA256SUMS \
            "${history_dir}/"
          if [[ ! -f history/index.csv ]]; then
            echo 'release,completed_at,targets,warcs,observed_govye,reachable_govye,response_records,revisit_records' > history/index.csv
          fi
          printf '%s,%s,%s,%s,%s,%s,%s,%s\n' \
            "${RELEASE_TAG}" "${captured_at}" "${site_count}" "${archive_count}" \
            "${observed_count}" "${reachable_count}" "${response_count}" "${revisit_count}" \
            >> history/index.csv
          {
            echo '# Latest archive run'
            echo
            echo "- Release: [${RELEASE_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
            echo "- Completed: ${captured_at}"
            echo "- Configured targets processed: ${site_count}"
            echo "- WARC files produced: ${archive_count}"
            echo "- Observed .gov.ye domains: ${observed_count}"
            echo "- Reachable .gov.ye web hosts: ${reachable_count}"
            echo "- New response records stored: ${response_count}"
            echo "- Unchanged payload revisit records: ${revisit_count}"
            echo
            echo 'Detailed metadata and every CDX index are retained permanently under history/.'
            echo 'WARC files are attached to the release, and archive releases are never removed by automation.'
          } > LATEST.md
          cp out/govye-domains.txt govye-domains.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LATEST.md govye-domains.txt history
          git commit -m "chore: record archive ${RELEASE_TAG}"
          git push origin HEAD:main
